[workspace]
resolver = "2"
members = [
  "dcapal-backend/crates/backend",
  "dcapal-backend/crates/migration",
  "dcapal-backend/crates/openapi-generator",
  "dcapal-optimizer-wasm/crates/optimizer",
]

[workspace.package]
version = "0.9.0"
authors = ["Leonardo Arcari <leonardo1.arcari@gmail.com>"]
edition = "2024"
rust-version = "1.97.1"

[profile.release]
lto = "thin"

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.release-wasm]
inherits = "release"
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
config = "0.15.25"
console_error_panic_hook = { version = "0.1.7" }
const_format = "0.2.36"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-redis = { version = "0.23.0", features = ["serde"] }
env_logger = "0.11.11"
failsafe = "1.3.0"
futures = "0.3.33"
getrandom = { version = "0.4.3" }
glob = "0.3.4"
hyper = { version = "1.11.0", features = ["full"] }
ip2location = "0.6.1"
itertools = "0.15.0"
jsonschema = { version = "0.49.3", default-features = false }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
lazy_static = "1.5.0"
log = "0.4.33"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
num_enum = "0.7.4"
parking_lot = "0.12.5"
rand = "0.10.2"
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "gzip",
  "json",
  "rustls-no-provider",
] }
rquest = { package = "wreq", version = "6.0.0-rc.29", features = ["json", "stream"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = { version = "1.42.1", features = [
  "serde",
  "serde-float",
  "serde-with-str",
  "macros",
] }
rust_decimal_macros = "1.40.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "macros",
  "migrate",
  "chrono",
  "rust_decimal",
  "uuid",
] }
strum_macros = "0.28.0"
test-log = { version = "0", features = ["log"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["chrono", "decimal", "uuid", "axum_extras"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
wasm-bindgen-test = "0.3.76"
wasm-logger = "0.2.0"
