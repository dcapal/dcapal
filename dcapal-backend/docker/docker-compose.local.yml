services:
  dcapal:
    image: dcapal-backend:local
    build:
      context: ..
      dockerfile: ./dcapal-backend/docker/Dockerfile.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${METRICS_PORT:-9000}:9000"
    networks:
      - dcapalnetwork
    volumes:
      - ./dcapal.yml:/var/dcapal/dcapal-backend/dcapal.yml:ro
      - dcapal_data:/var/dcapal/dcapal-backend/data/dcapal
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  dcapal_data:
