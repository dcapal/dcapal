services:
  redis:
    image: redis/redis-stack-server:7.2.0-v0
    restart: unless-stopped
    networks:
      - dcapalnetwork
    volumes:
      - ./config/redis/redis-stack.conf:/redis-stack.conf:ro
      - ./config/redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=dcapal redis-cli --user dcapal ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 3

  db:
    image: timescale/timescaledb-ha:pg18.4-ts2.28.3-all-oss
    restart: unless-stopped
    expose:
      - "5432"
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    networks:
      - dcapalnetwork
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      # Authentication is checked by the backend entrypoint. Keeping this
      # probe limited to server readiness lets a password mismatch produce a
      # useful application error instead of an opaque unhealthy dependency.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  dcapalnetwork:
