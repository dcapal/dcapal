[package]
name = "dcapal-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# `derive_more` is the project's standard for small mechanical trait derives
# (see dcapal-backend/AGENTS.md) and is kept for upcoming types even while no
# module uses it, so Cargo's unused-dependency manifest lint is allowed.
[lints.cargo]
unused_dependencies = "allow"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
config = { workspace = true }
const_format = { workspace = true }
jiff = { workspace = true }
jiff-sqlx = { workspace = true }
derive_more = { workspace = true }
failsafe = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
hyper = { workspace = true }
ip2location = { workspace = true }
itertools = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
lazy_static = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
moka = { workspace = true }
num_enum = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
rquest = { workspace = true }

[dev-dependencies]
migration = { path = "../migration" }
mockall = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
