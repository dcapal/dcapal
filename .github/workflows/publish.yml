name: Publish

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Deploy the published image
        required: true
        default: none
        type: choice
        options:
          - none
          - development
          - production
  push:
    branches:
      - master
      - dev
    tags:
      - '*'
    # Run publishing for changes in application trees and workspace packages.
    paths:
      - '.nvmrc'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'dcapal-backend/**'
      - 'dcapal-optimizer-wasm/**'
      - 'dcapal-frontend/**'
      - 'packages/**'

env:
  CARGO_TERM_COLOR: always
  ACTIONS_CACHE_SERVICE_V2: "true"
  DOCKER_REPO: leonardoarcari/dcapal
  SCCACHE_GHA_VERSION: dcapal-v1

permissions:
  contents: read
  actions: write

concurrency:
  group: dcapal-publish
  cancel-in-progress: false
  queue: max

jobs:
  resolve-image:
    name: resolve:image
    runs-on: ubuntu-slim
    outputs:
      image_ref: ${{ steps.vars.outputs.image_ref }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ref_tag: ${{ steps.vars.outputs.ref_tag }}
      deploy_environment: ${{ steps.vars.outputs.deploy_environment }}
    steps:
      - id: vars
        env:
          DEPLOY_ENVIRONMENT_INPUT: ${{ inputs.deploy_environment }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "${REF}" in
            refs/heads/master|refs/heads/dev|refs/tags/*)
              ref_tag="${REF_NAME}"
              ;;
            *)
              echo "Publish supports master, dev, and Git tag refs; got ${REF}" >&2
              exit 1
              ;;
          esac

          if [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/master" ]]; then
            deploy_environment=development
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_environment="${DEPLOY_ENVIRONMENT_INPUT:-none}"
          else
            deploy_environment=none
          fi

          {
            echo "ref_tag=${ref_tag}"
            echo "image_tag=${SHA}"
            echo "image_ref=${DOCKER_REPO}:${SHA}"
            echo "deploy_environment=${deploy_environment}"
          } >> "${GITHUB_OUTPUT}"

  build-publish-docker-image:
    name: build:backend:image
    runs-on: ubuntu-latest
    needs: [resolve-image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.resolve-image.outputs.ref_tag }}
            type=raw,value=${{ needs.resolve-image.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-docker-cache
        with:
          path: ${{ runner.temp }}/docker-rust-cache
          key: ubuntu-docker-sccache-rust-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'dcapal-backend/docker/Dockerfile.ci') }}
          restore-keys: |
            ubuntu-docker-sccache-rust-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/docker-rust-cache
          dockerfile: dcapal-backend/docker/Dockerfile.ci
          skip-extraction: ${{ steps.rust-docker-cache.outputs.cache-hit }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dcapal-backend/docker/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCCACHE_GHA_VERSION=${{ env.SCCACHE_GHA_VERSION }}
          secret-envs: |
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
            actions_results_url=ACTIONS_RESULTS_URL
          # Publish owns its sccache scope and reads smoke's shared layers.
          cache-from: |
            type=gha,scope=dcapal-backend-sccache-smoke
            type=gha,scope=dcapal-backend-sccache-publish
          cache-to: type=gha,scope=dcapal-backend-sccache-publish,mode=max,ignore-error=true

  deploy:
    name: deploy:${{ needs.resolve-image.outputs.deploy_environment }}
    needs: [resolve-image, build-publish-docker-image]
    if: ${{ needs.resolve-image.outputs.deploy_environment != 'none' }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_environment: ${{ needs.resolve-image.outputs.deploy_environment }}
      image_tag: ${{ needs.resolve-image.outputs.image_tag }}
    secrets: inherit
