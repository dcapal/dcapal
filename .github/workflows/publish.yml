name: Publish

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Deploy the published image
        required: true
        default: none
        type: choice
        options:
          - none
          - development
          - production
  push:
    branches:
      - master
      - dev
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: leonardoarcari/dcapal
  SCCACHE_GHA_VERSION: dcapal-v1

permissions:
  contents: read
  actions: write

jobs:
  resolve-image:
    name: resolve:image
    runs-on: ubuntu-slim
    outputs:
      image_ref: ${{ steps.vars.outputs.image_ref }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ref_tag: ${{ steps.vars.outputs.ref_tag }}
    steps:
      - id: vars
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "${REF}" in
            refs/heads/master|refs/heads/dev|refs/tags/*)
              ref_tag="${REF_NAME}"
              ;;
            *)
              echo "Publish supports master, dev, and Git tag refs; got ${REF}" >&2
              exit 1
              ;;
          esac

          {
            echo "ref_tag=${ref_tag}"
            echo "image_tag=${SHA}"
            echo "image_ref=${DOCKER_REPO}:${SHA}"
          } >> "${GITHUB_OUTPUT}"

  build-publish-docker-image:
    name: build:backend:image
    runs-on: ubuntu-latest
    needs: [resolve-image]
    steps:
      - uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.resolve-image.outputs.ref_tag }}
            type=raw,value=${{ needs.resolve-image.outputs.image_tag }}
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/cache@v6
        id: rust-docker-cache
        with:
          path: ${{ runner.temp }}/docker-rust-cache
          key: ubuntu-docker-sccache-rust-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'dcapal-backend/docker/Dockerfile.ci') }}
          restore-keys: |
            ubuntu-docker-sccache-rust-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/docker-rust-cache
          dockerfile: dcapal-backend/docker/Dockerfile.ci
          skip-extraction: ${{ steps.rust-docker-cache.outputs.cache-hit }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dcapal-backend/docker/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCCACHE_GHA_VERSION=${{ env.SCCACHE_GHA_VERSION }}
          secret-envs: |
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
            actions_results_url=ACTIONS_RESULTS_URL
          # Publish owns its sccache scope and reads smoke's shared layers.
          cache-from: |
            type=gha,scope=dcapal-backend-sccache-smoke
            type=gha,scope=dcapal-backend-sccache-publish
          cache-to: type=gha,scope=dcapal-backend-sccache-publish,mode=max,ignore-error=true

  deploy:
    name: deploy:${{ inputs.deploy_environment }}
    needs: [resolve-image, build-publish-docker-image]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment != 'none' }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_environment: ${{ inputs.deploy_environment }}
      image_tag: ${{ needs.resolve-image.outputs.image_tag }}
    secrets: inherit
