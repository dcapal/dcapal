name: CI

on:
  push:
    branches: ["master", "dev", "rc/**"]
  pull_request:
    branches: ["master", "dev", "rc/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONS_CACHE_SERVICE_V2: "true"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_GHA_VERSION: dcapal-v1

permissions:
  contents: read
  actions: write

jobs:
  backend-format:
    name: check:fmt:backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
          components: rustfmt

      - name: Check backend formatting
        working-directory: dcapal-backend
        run: cargo fmt --all -- --check

  backend-lint:
    name: check:lint:backend
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
          components: clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Lint backend
        working-directory: dcapal-backend
        run: cargo clippy -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  backend-test:
    name: test:backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_VERSION: 2.110.0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Cache Supabase CLI npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-supabase-cli-${{ env.SUPABASE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-supabase-cli-

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start backend database
        run: make backend-db-up

      - name: Test backend
        run: make test-backend

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Stop backend database
        if: always()
        run: make backend-db-down

  backend-openapi-check:
    name: check:openapi:backend
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Generate OpenAPI spec
        run: make export-openapi

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code -- dcapal-backend/docs/openapi.json
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  optimizer-lint:
    name: check:lint:optimizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
          components: clippy, rustfmt
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Lint optimizer
        working-directory: dcapal-optimizer-wasm
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  optimizer-build-test:
    name: build:test:optimizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version

      - name: Test optimizer
        working-directory: dcapal-optimizer-wasm
        run: |
          RUST_LOG=info cargo test -- --nocapture
          wasm-pack test --headless --chrome

      - name: Build optimizer package
        working-directory: dcapal-optimizer-wasm
        run: wasm-pack build

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Archive dcapal-optimizer-wasm pkg
        uses: actions/upload-artifact@v7
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

  frontend-format:
    name: check:fmt:frontend
    runs-on: ubuntu-slim
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@v8
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm frontend:lint

  frontend-typecheck:
    name: check:typecheck:frontend
    runs-on: ubuntu-slim
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@v8
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm frontend:typecheck

  frontend-build-test:
    name: build:test:frontend
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@v8
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm frontend:build

      - name: Unit tests
        run: pnpm frontend:test

  frontend-e2e-tests:
    name: test:e2e:frontend (${{ matrix.lane }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chrome
            collect_coverage: true
          - lane: other-browsers
            collect_coverage: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@v8
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version the browser cache so Playwright upgrades invalidate old binaries.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v1-

      - name: Install Playwright Browsers
        run: pnpm --filter @dcapal/frontend exec playwright install --with-deps

      - name: Run Chrome coverage journeys
        if: ${{ matrix.collect_coverage }}
        run: pnpm frontend:test:e2e:coverage

      - name: Run other browser journeys
        if: ${{ !matrix.collect_coverage }}
        run: pnpm frontend:test:e2e --project=firefox --project=webkit

      - name: Run API-client coverage tests
        if: ${{ matrix.collect_coverage }}
        run: pnpm --filter @dcapal/api-client test:coverage

      - name: Build combined coverage report
        if: ${{ matrix.collect_coverage }}
        run: pnpm frontend:coverage:report

      - uses: actions/upload-artifact@v7
        if: ${{ always() && !matrix.collect_coverage }}
        with:
          name: playwright-report-other-browsers
          path: dcapal-frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.collect_coverage }}
        with:
          name: frontend-coverage-report
          path: coverage/frontend/
          retention-days: 30

  backend-smoke-test:
    name: test:smoke:backend
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      POSTGRES_DB: postgres
      SUPABASE_VERSION: 2.110.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # Supabase setup-cli installs the pinned package through npm.
      - name: Cache Supabase CLI npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-supabase-cli-${{ env.SUPABASE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-supabase-cli-

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/cache@v6
        id: rust-docker-cache
        with:
          path: ${{ runner.temp }}/docker-rust-cache
          key: ubuntu-docker-sccache-rust-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'dcapal-backend/docker/Dockerfile.ci') }}
          restore-keys: |
            ubuntu-docker-sccache-rust-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/docker-rust-cache
          dockerfile: dcapal-backend/docker/Dockerfile.ci
          skip-extraction: ${{ steps.rust-docker-cache.outputs.cache-hit }}

      - name: Build dcapal-backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dcapal-backend/docker/Dockerfile.ci
          load: true
          push: false
          tags: dcapal-backend:smoke
          build-args: |
            SCCACHE_GHA_VERSION=${{ env.SCCACHE_GHA_VERSION }}
          secret-envs: |
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
            actions_results_url=ACTIONS_RESULTS_URL
          # Smoke owns its sccache scope and reads publish's shared layers.
          cache-from: |
            type=gha,scope=dcapal-backend-sccache-smoke
            type=gha,scope=dcapal-backend-sccache-publish
          cache-to: type=gha,scope=dcapal-backend-sccache-smoke,mode=max,ignore-error=true

      - name: Configure dcapal env
        run: |
          cat > dcapal-backend/dcapal.env << EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          EOF

      - name: Configure dcapal.yml
        run: |
          cat > dcapal-backend/dcapal.yml << EOF
          app:
            providers:
              priceProvider: kraken
              cwApiKey: CW_API_KEY
              ipApiKey: IP_API_KEY
            auth:
              jwtSecret: super-secret-jwt-token-with-at-least-32-characters-long

            log:
              level: dcapal_backend=info,tower_http=debug
              file: data/dcapal/dcapal.log
              enableStdout: true

          server:
            web:
              hostname: 0.0.0.0
              port: 8080
            metrics:
              hostname: 0.0.0.0
              port: 9000
            redis:
              hostname: redis
              port: 6379
              user: dcapal
              password: dcapal
            postgres:
              hostname: ${POSTGRES_HOST}
              port: ${POSTGRES_PORT}
              user: ${POSTGRES_USER}
              password: ${POSTGRES_PASSWORD}
              database: ${POSTGRES_DB}
          EOF

      - name: Configure docker compose override
        run: |
          cat > dcapal-backend/docker-compose.override.yml << EOF
          services:
            dcapal:
              image: dcapal-backend:smoke
              env_file: dcapal.env
          EOF

      - name: Start Supabase
        run: cd dcapal-backend && supabase start --workdir ./config

      - name: Run backend stack and wait for health
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.local.yml \
                         -f docker-compose.override.yml \
                         up --no-build --wait --wait-timeout 120

      - name: Print backend logs on failure
        if: ${{ failure() && hashFiles('dcapal-backend/docker-compose.override.yml') != '' }}
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.local.yml \
                         -f docker-compose.override.yml \
                         logs

      - name: Stop backend stack
        if: ${{ always() && hashFiles('dcapal-backend/docker-compose.override.yml') != '' }}
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.local.yml \
                         -f docker-compose.override.yml \
                         down

      - name: Stop Supabase
        if: always()
        run: cd dcapal-backend && supabase stop --workdir ./config
