name: CI

on:
  push:
    branches: ["master", "dev", "rc/**"]
  pull_request:
    branches: ["master", "dev", "rc/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONS_CACHE_SERVICE_V2: "true"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_GHA_VERSION: dcapal-v1

permissions:
  contents: read
  actions: write

jobs:
  backend-format:
    name: check:fmt:backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
          components: rustfmt

      - name: Check backend formatting
        run: cargo fmt --all -- --check

  backend-lint:
    name: check:lint:backend
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
          components: clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Lint backend
        run: cargo clippy -p dcapal-backend -p migration -p openapi-generator -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  build-test-backend:
    name: build:test:backend
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Start backend database
        run: make backend-db-up

      - name: Test backend
        run: make test-backend

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Stop backend database
        if: always()
        run: make backend-db-down

  backend-openapi-check:
    name: check:openapi:backend
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Generate OpenAPI spec
        run: make export-openapi

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code -- dcapal-backend/docs/openapi.json
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  optimizer-lint:
    name: check:lint:optimizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
          components: clippy, rustfmt
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Lint optimizer
        working-directory: dcapal-optimizer-wasm/crates/optimizer
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  optimizer-build-test:
    name: build:test:optimizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-shared-key: rust-sccache
          cache-on-failure: false
          cache-targets: false
          rustflags: ""
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version

      - name: Test optimizer
        working-directory: dcapal-optimizer-wasm/crates/optimizer
        run: |
          RUST_LOG=info cargo test -- --nocapture
          wasm-pack test --headless --chrome

      - name: Build optimizer package
        working-directory: dcapal-optimizer-wasm/crates/optimizer
        run: wasm-pack build --out-dir ../../pkg

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Archive dcapal-optimizer-wasm pkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

  frontend-format:
    name: check:fmt:frontend
    runs-on: ubuntu-slim
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm frontend:lint

  frontend-typecheck:
    name: check:typecheck:frontend
    runs-on: ubuntu-slim
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm frontend:typecheck

  frontend-build-test:
    name: build:test:frontend
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm frontend:build

      - name: Unit tests
        run: pnpm frontend:test

  frontend-e2e-tests:
    name: test:e2e:frontend (${{ matrix.lane }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chrome
            collect_coverage: true
          - lane: other-browsers
            collect_coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version the browser cache so Playwright upgrades invalidate old binaries.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v1-

      - name: Install Playwright Browsers
        run: pnpm --filter @dcapal/frontend exec playwright install --with-deps

      - name: Run Chrome coverage journeys
        if: ${{ matrix.collect_coverage }}
        run: pnpm frontend:test:e2e:coverage

      - name: Run other browser journeys
        if: ${{ !matrix.collect_coverage }}
        run: pnpm frontend:test:e2e --project=firefox --project=webkit

      - name: Run API-client coverage tests
        if: ${{ matrix.collect_coverage }}
        run: pnpm --filter @dcapal/api-client test:coverage

      - name: Build combined coverage report
        if: ${{ matrix.collect_coverage }}
        run: pnpm frontend:coverage:report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !matrix.collect_coverage }}
        with:
          name: playwright-report-other-browsers
          path: dcapal-frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.collect_coverage }}
        with:
          name: frontend-coverage-report
          path: coverage/frontend/
          retention-days: 30

  frontend-storybook-tests:
    name: test:storybook:frontend
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version the browser cache so Playwright upgrades invalidate old binaries.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v1-

      - name: Install Playwright Browsers
        run: pnpm --filter @dcapal/frontend exec playwright install --with-deps

      - name: Run Storybook regression tests
        run: pnpm --filter @dcapal/frontend storybook:test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-storybook
          path: dcapal-frontend/playwright-report/
          retention-days: 30

  test-e2e-smoke:
    name: test:e2e:smoke
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: optimizer-build-test
    env:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      POSTGRES_DB: postgres
      SUPABASE_VERSION: 2.110.0
      SMOKE_USER_EMAIL: smoke@example.com
      SMOKE_USER_PASSWORD: smoke-password-123456
      SMOKE_PORTFOLIO_ID: 11111111-1111-4111-8111-111111111111
      SMOKE_PORTFOLIO_NAME: Smoke portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The generated package is a local dependency and must exist before pnpm install.
      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The full-stack smoke uses one Chromium project; the deterministic frontend job owns the browser matrix.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v1-

      - name: Install Playwright Chromium
        run: pnpm --filter @dcapal/frontend exec playwright install --with-deps chromium

      # Supabase setup-cli installs the pinned package through npm.
      - name: Cache Supabase CLI npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-supabase-cli-${{ env.SUPABASE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-supabase-cli-

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-docker-cache
        with:
          path: ${{ runner.temp }}/docker-rust-cache
          key: ubuntu-docker-sccache-rust-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'dcapal-backend/docker/Dockerfile.ci') }}
          restore-keys: |
            ubuntu-docker-sccache-rust-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/docker-rust-cache
          dockerfile: dcapal-backend/docker/Dockerfile.ci
          skip-extraction: ${{ steps.rust-docker-cache.outputs.cache-hit }}

      - name: Build dcapal-backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dcapal-backend/docker/Dockerfile.ci
          load: true
          push: false
          tags: dcapal-backend:smoke
          build-args: |
            SCCACHE_GHA_VERSION=${{ env.SCCACHE_GHA_VERSION }}
          secret-envs: |
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
            actions_results_url=ACTIONS_RESULTS_URL
          # Smoke owns its sccache scope and reads publish's shared layers.
          cache-from: |
            type=gha,scope=dcapal-backend-sccache-smoke
            type=gha,scope=dcapal-backend-sccache-publish
          cache-to: type=gha,scope=dcapal-backend-sccache-smoke,mode=max,ignore-error=true

      - name: Configure dcapal env
        run: |
          cat > dcapal-backend/dcapal.env << EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          EOF

      - name: Configure production Compose variables
        run: |
          {
            echo "DCAPAL_IMAGE=dcapal-backend:smoke"
            echo "DCAPAL_ENV_FILE=dcapal.env"
            echo "DCAPAL_API_PORT=8080"
            echo "DCAPAL_METRICS_PORT=9000"
            echo "DCAPAL_NETWORK=dcapalnetwork"
          } >> "$GITHUB_ENV"

      - name: Start Supabase
        run: cd dcapal-backend && supabase start --workdir ./config

      - name: Capture Supabase local environment
        run: |
          cd dcapal-backend
          supabase status --workdir ./config -o env > supabase.env
          set -a
          source supabase.env
          set +a
          : "${API_URL:?Supabase did not report API_URL}"
          : "${ANON_KEY:?Supabase did not report ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Supabase did not report SERVICE_ROLE_KEY}"
          : "${JWT_SECRET:?Supabase did not report JWT_SECRET}"
          JWKS="$(curl --fail --silent --show-error "${API_URL}/auth/v1/.well-known/jwks.json" | jq -c '.')"
          : "${JWKS:?Supabase did not report signing keys}"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_AUTH_JWT_SECRET=${JWT_SECRET}"
            echo "SUPABASE_AUTH_JWKS=${JWKS}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Configure dcapal.yml
        run: |
          export DCAPAL_JWT_SECRET="${SUPABASE_AUTH_JWT_SECRET}"
          export DCAPAL_JWT_JWKS="${SUPABASE_AUTH_JWKS}"
          export DCAPAL_WEB_HOSTNAME=0.0.0.0
          export DCAPAL_METRICS_HOSTNAME=0.0.0.0
          export DCAPAL_REDIS_HOSTNAME=redis
          export DCAPAL_POSTGRES_HOSTNAME="${POSTGRES_HOST}"
          export DCAPAL_POSTGRES_PORT="${POSTGRES_PORT}"
          export DCAPAL_POSTGRES_USER="${POSTGRES_USER}"
          export DCAPAL_POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
          export DCAPAL_POSTGRES_DATABASE="${POSTGRES_DB}"
          export DCAPAL_LOG_FILE=data/dcapal.log
          export DCAPAL_LOG_ENABLE_STDOUT=true
          python3 dcapal-backend/scripts/render-dcapal-config.py \
            --output dcapal-backend/dcapal.yml

      - name: Validate production Compose contract
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml config --format json |
            jq -e '
              (.services.dcapal.volumes | any(.[]; .target == "/var/dcapal/dcapal-backend/data")) and
              (.services.dcapal.depends_on.redis.condition == "service_healthy") and
              (.services.dcapal.depends_on.db.condition == "service_healthy") and
              (.services.dcapal.healthcheck != null)
            '

      - name: Run backend stack and wait for health
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.prod.yml \
                         up --no-build --wait --wait-timeout 120

      - name: Run full-stack frontend smoke
        run: pnpm frontend:test:e2e:smoke

      - name: Assert Timescale smoke data
        run: dcapal-backend/scripts/assert-smoke-data.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-smoke
          path: dcapal-frontend/playwright-report/
          retention-days: 30

      - name: Print backend logs on failure
        if: ${{ failure() }}
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.prod.yml \
                         logs

      - name: Stop backend stack
        if: always()
        run: |
          cd dcapal-backend
          docker compose -f docker-compose.yml \
                         -f ./docker/docker-compose.prod.yml \
                         down

      - name: Stop Supabase
        if: always()
        run: cd dcapal-backend && supabase stop --workdir ./config
