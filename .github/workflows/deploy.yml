name: Deploy

on:
  workflow_call:
    inputs:
      deploy_environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Deployment target
        required: true
        type: choice
        options: [development, production]
      image_tag:
        description: Published Docker image tag
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: leonardoarcari/dcapal
  IP2LOCATION_FILENAME: IP2LOCATION-LITE-DB5.IPV6.BIN

jobs:
  validate-inputs:
    runs-on: ubuntu-slim
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - run: |
          set -euo pipefail
          case "${DEPLOY_ENVIRONMENT}" in
            development|production) ;;
            *) echo "Unsupported deployment environment: ${DEPLOY_ENVIRONMENT}" >&2; exit 1 ;;
          esac
          [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Image tag is not a valid Docker tag" >&2
            exit 1
          }

  optimizer-build:
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-shared-key: rust
          cache-on-failure: false
          rustflags: ""
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version

      - name: Build
        working-directory: dcapal-optimizer-wasm/crates/optimizer
        run: wasm-pack build --release --out-dir ../../pkg

      - name: Archive dcapal-optimizer-wasm pkg
        uses: actions/upload-artifact@v7
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

  frontend-build:
    runs-on: ubuntu-latest
    needs: optimizer-build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Download dcapal-optimizer-wasm pkg
        uses: actions/download-artifact@v8
        with:
          name: dcapal-optimizer-wasm-pkg
          path: dcapal-optimizer-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure .env.production
        env:
          VITE_SUPABASE_URL: ${{ inputs.deploy_environment == 'production' && secrets.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL_DEV }}
          VITE_SUPABASE_ANON_KEY: ${{ inputs.deploy_environment == 'production' && secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY_DEV }}
        run: |
          cat > dcapal-frontend/.env.production << EOF
          REACT_APP_ENABLE_COOKIE_BUTTON=0
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          EOF

      - name: Build
        run: pnpm frontend:build

      - name: Archive dcapal-frontend
        uses: actions/upload-artifact@v7
        with:
          name: dcapal-frontend-dist
          path: dcapal-frontend/dist

  deploy:
    concurrency:
      group: dcapal-deployment
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-slim
    needs: frontend-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download dcapal-frontend
        uses: actions/download-artifact@v8
        with:
          name: dcapal-frontend-dist
          path: dcapal-frontend/dist

      - name: Deploy dcapal-frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: dcapal-frontend/dist
          target: ${{ inputs.deploy_environment == 'production' && secrets.WEB_DIR || secrets.WEB_DIR_DEV }}
          strip_components: 2

      - name: Download IP2Location database
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: "npm"
          apiToken: ${{ secrets.CF_R2_API_TOKEN }}
          accountId: ${{ secrets.CF_R2_ACCOUNT_ID }}
          workingDirectory: dcapal-backend/data/dcapal
          command: r2 object get ip2location-db/${{ env.IP2LOCATION_FILENAME }}.zip --remote

      - name: Deploy IP2Location database
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: dcapal-backend/data/dcapal
          target: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_DIR || secrets.DCAPAL_DIR_DEV }}
          strip_components: 1

      - name: Unpack IP2Location database
        uses: appleboy/ssh-action@master
        env:
          DCAPAL_DIR: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_DIR || secrets.DCAPAL_DIR_DEV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          envs: DCAPAL_DIR,IP2LOCATION_FILENAME
          script: |
            cd ${DCAPAL_DIR}/data/dcapal
            ls -la
            unzip ${IP2LOCATION_FILENAME}.zip -d ip2location
            mv ip2location/${IP2LOCATION_FILENAME} .
            rm -rf ip2location
            rm ${IP2LOCATION_FILENAME}.zip
            ls -la

      - name: Configure docker-compose.yml
        env:
          REDIS_PORT: ${{ inputs.deploy_environment == 'production' && secrets.REDIS_PORT || secrets.REDIS_PORT_DEV }}
          POSTGRES_PORT: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_PORT || secrets.POSTGRES_PORT_DEV }}
          POSTGRES_USER: ${{ secrets.PG_DCAPAL_USER }}
          POSTGRES_PASSWORD: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD_DEV }}
          POSTGRES_DATABASE: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_DATABASE || secrets.POSTGRES_DATABASE_DEV }}
        run: |
          cat > dcapal-backend/docker-compose.yml << EOF
          version: "3.9"
          services:
            redis:
              image: redis/redis-stack-server
              container_name: ${{ inputs.deploy_environment == 'production' && 'redis' || 'redis-dev' }}
              restart: always
              ports:
                - ${REDIS_PORT}:6379
              networks:
                - ${{ inputs.deploy_environment == 'production' && 'dcapalnetwork' || 'dcapal-dev-network' }}
              volumes:
                - ./config/redis/redis-stack.conf:/redis-stack.conf
                - ./config/redis/users.acl:/etc/redis/users.acl
                - ./data/redis/:/data
              healthcheck:
                test: redis-cli --raw ping
                interval: 10s
                timeout: 10s
                retries: 3

            db:
              image: timescale/timescaledb-ha:pg18.4-ts2.28.3-all-oss
              container_name: ${{ inputs.deploy_environment == 'production' && 'db' || 'db-dev' }}
              restart: always
              # set shared memory limit when using docker-compose
              shm_size: 128mb
              ports:
                - "${POSTGRES_PORT}:5432"
              volumes:
              - ./data/db/:/home/postgres/pgdata/data
              - ./config/db/init/:/docker-entrypoint-initdb.d
              networks:
                - ${{ inputs.deploy_environment == 'production' && 'dcapalnetwork' || 'dcapal-dev-network' }}
              environment:
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              healthcheck:
                test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d postgres -c 'SELECT 1' > /dev/null 2>&1" ]
                interval: 10s
                timeout: 10s
                retries: 10
                start_period: 60s

          networks:
            ${{ inputs.deploy_environment == 'production' && 'dcapalnetwork' || 'dcapal-dev-network' }}:
          EOF

      - name: Configure docker-compose.prod.yml
        env:
          DCAPAL_API_PORT: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_API_PORT || secrets.DCAPAL_API_PORT_DEV }}
          DCAPAL_METRICS_PORT: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_METRICS_PORT || secrets.DCAPAL_METRICS_PORT_DEV }}
        run: |
          cat > dcapal-backend/docker/docker-compose.prod.yml << EOF
          version: "3.9"
          services:
            dcapal:
              image: ${{ env.DOCKER_REPO }}:${{ inputs.image_tag }}
              env_file: dcapal.env
              restart: always
              ports:
                - ${DCAPAL_API_PORT}:8080
                - ${DCAPAL_METRICS_PORT}:9000
              networks:
                - ${{ inputs.deploy_environment == 'production' && 'dcapalnetwork' || 'dcapal-dev-network' }}
              volumes:
                - ./dcapal.yml:/var/dcapal/dcapal-backend/dcapal.yml
                - ./data/dcapal:/var/dcapal/dcapal-backend/data
              depends_on:
                redis:
                  condition: service_healthy
                db:
                  condition: service_healthy
              healthcheck:
                test: curl --fail http://localhost:8080 || exit 1
                interval: 10s
                timeout: 10s
                retries: 5
          EOF

      - name: Configure Redis ACL
        env:
          REDIS_USER: ${{ secrets.REDIS_USER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_ADMIN: ${{ secrets.REDIS_ADMIN }}
          REDIS_ADMIN_PASSWORD: ${{ secrets.REDIS_ADMIN_PASSWORD }}
        run: |
          cat > dcapal-backend/config/redis/users.acl << EOF
          user ${REDIS_USER} +@all -@dangerous ~* on >${REDIS_PASSWORD}
          user ${REDIS_ADMIN} ~* &* +@all on >${REDIS_ADMIN_PASSWORD}
          user default off
          EOF

      - name: Configure Postgres Dcapal user
        env:
          PG_DCAPAL_USER: ${{ secrets.PG_DCAPAL_USER }}
          PG_DCAPAL_PASSWORD: ${{ secrets.PG_DCAPAL_PASSWORD }}
        run: |
          cat > dcapal-backend/config/db/init/99_create_dcapal_user.sql << EOF
          CREATE USER "${PG_DCAPAL_USER}" WITH PASSWORD '${PG_DCAPAL_PASSWORD}';
          GRANT app_role TO "${PG_DCAPAL_USER}";
          EOF

      - name: Configure dcapal.yml
        env:
          DCAPAL_CW_API_KEY: ${{ secrets.DCAPAL_CW_API_KEY }}
          DCAPAL_IP_API_KEY: ${{ secrets.DCAPAL_IP_API_KEY }}
          DCAPAL_CMC_API_KEY: ${{ secrets.DCAPAL_CMC_API_KEY }}
          JWT_SECRET: ${{ inputs.deploy_environment == 'production' && secrets.JWT_SECRET || secrets.JWT_SECRET_DEV }}
          REDIS_USER: ${{ secrets.REDIS_USER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_USER: ${{ secrets.PG_DCAPAL_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PG_DCAPAL_PASSWORD }}
          POSTGRES_DATABASE: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_DATABASE || secrets.POSTGRES_DATABASE_DEV }}
        run: |
          export DCAPAL_JWT_SECRET="${JWT_SECRET}"
          export DCAPAL_CW_API_KEY="${DCAPAL_CW_API_KEY}"
          export DCAPAL_IP_API_KEY="${DCAPAL_IP_API_KEY}"
          export DCAPAL_CMC_API_KEY="${DCAPAL_CMC_API_KEY}"
          export DCAPAL_IP2LOCATION_PATH="data/${IP2LOCATION_FILENAME}"
          export DCAPAL_WEB_HOSTNAME=0.0.0.0
          export DCAPAL_METRICS_HOSTNAME=0.0.0.0
          export DCAPAL_REDIS_HOSTNAME=redis
          export DCAPAL_REDIS_USER="${REDIS_USER}"
          export DCAPAL_REDIS_PASSWORD="${REDIS_PASSWORD}"
          export DCAPAL_POSTGRES_HOSTNAME=db
          export DCAPAL_POSTGRES_PORT=5432
          export DCAPAL_POSTGRES_USER="${POSTGRES_USER}"
          export DCAPAL_POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
          export DCAPAL_POSTGRES_DATABASE="${POSTGRES_DATABASE}"
          export DCAPAL_LOG_FILE=data/dcapal.log
          export DCAPAL_LOG_ENABLE_STDOUT=false
          python3 dcapal-backend/scripts/render-dcapal-config.py \
            --output dcapal-backend/dcapal.yml

      - name: Configure dotenv
        env:
          POSTGRES_HOST: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_HOSTNAME || secrets.POSTGRES_HOSTNAME_DEV }}
          POSTGRES_USER: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_USER || secrets.POSTGRES_USER_DEV }}
          POSTGRES_PASSWORD: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD_DEV }}
          POSTGRES_DATABASE: ${{ inputs.deploy_environment == 'production' && secrets.POSTGRES_DATABASE || secrets.POSTGRES_DATABASE_DEV }}
        run: |
          cat > dcapal-backend/dcapal.env << EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=db
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_DB=${POSTGRES_DATABASE}
          POSTGRES_PORT=5432
          EOF

      - name: Deploy dcapal-backend config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: dcapal-backend/config,dcapal-backend/docker/docker-compose.prod.yml,dcapal-backend/docker-compose.yml,dcapal-backend/dcapal.yml,dcapal-backend/dcapal.env
          target: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_DIR || secrets.DCAPAL_DIR_DEV }}
          strip_components: 1

      - name: Deploy dcapal-backend
        uses: appleboy/ssh-action@master
        env:
          DCAPAL_DIR: ${{ inputs.deploy_environment == 'production' && secrets.DCAPAL_DIR || secrets.DCAPAL_DIR_DEV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          envs: DCAPAL_DIR
          script: |
            cd ${DCAPAL_DIR}
            ls -la
            mkdir -p ./data/dcapal
            mkdir -p ./data/db
            touch ./data/dcapal/dcapal.log
            docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml up -d --wait --wait-timeout 180
